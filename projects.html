<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects | Kaworu Suzuki Portfolio</title>
  <link rel="stylesheet" href="css/style.css?v=20260721-3">
  <style>
    :root { --header-h: 72px; }

    .projects-page {
      padding-top: var(--header-h);
    }

    .projects-hero {
      width: 100vw;
      margin-left: calc(50% - 50vw);
      padding: 80px var(--container-pad);
      background: var(--bg);
      text-align: center;
      margin-bottom: 20px;

    }

    .projects-hero h1 {
      font-family: var(--font-en);
      font-size: 2rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--sub);
    }

    .projects-hero p {
      color: var(--text);
      font-size: 1rem;
      margin-top: 20px;
    }

    .projects-section {
      padding: var(--container-pad);
      max-width: var(--container-max);
      margin: 0 auto;
    }

    .projects-controls {
      display: grid;
      grid-template-columns: 1.2fr 1fr 1fr;
      gap: 16px;
      align-items: end;
      margin: 24px auto 10px;
      max-width: var(--container-max);
      padding: 0 var(--container-pad);
      position: relative;
      z-index: 3;
    }

    .projects-controls.is-open {
      margin-bottom: 180px;
    }

    .control-field label {
      display: block;
      font-size: 0.75rem;
      letter-spacing: 0.12em;
      color: var(--sub);
      text-transform: uppercase;
      margin-bottom: 8px;
      font-family: var(--font-en);
    }

    .control-field input,
    .control-field select,
    .select-trigger {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid rgba(0,0,0,0.2);
      background: rgba(255,255,255,0.8);
      font-family: var(--font-jp);
      font-size: 0.95rem;
      color: var(--text);
      outline: none;
      -webkit-appearance: none;
      appearance: none;
    }

    .select-shell {
      position: relative;
    }

    .select-trigger {
      text-align: left;
      padding-right: 44px;
      cursor: pointer;
      background-image:
        linear-gradient(45deg, transparent 50%, rgba(0,0,0,0.6) 50%),
        linear-gradient(135deg, rgba(0,0,0,0.6) 50%, transparent 50%),
        linear-gradient(to right, rgba(0,0,0,0.08), rgba(0,0,0,0.08));
      background-position:
        calc(100% - 22px) 52%,
        calc(100% - 16px) 52%,
        calc(100% - 40px) 50%;
      background-size: 6px 6px, 6px 6px, 1px 18px;
      background-repeat: no-repeat;
    }

    .select-menu {
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 8px);
      background: rgba(255,255,255,0.98);
      border: 1px solid rgba(0,0,0,0.16);
      border-radius: 12px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.12);
      padding: 6px;
      display: none;
      z-index: 10;
    }

    .select-menu.is-open { display: block; }

    .select-option {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    .select-option:hover {
      background: rgba(0,0,0,0.06);
    }

    .select-option.is-active {
      background: rgba(0,0,0,0.08);
      font-weight: 500;
    }

    .projects-count {
      max-width: var(--container-max);
      margin: 10px auto 0;
      padding: 0 var(--container-pad);
      color: var(--sub);
      font-size: 0.85rem;
    }

    .project-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .project-card {
      display: flex;
      flex-direction: column;
      background: white;
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      transition: all 0.3s ease;
      height: 100%;
    }

    .project-card:hover {
      border-color: var(--text);
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
    }

    .card-img {
      width: 100%;
      height: 200px;
      overflow: hidden;
      background: var(--bg);
    }

    .card-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .card-content {
      padding: 20px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    .card-tag {
      display: inline-block;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--sub);
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .card-content h3 {
      font-size: 1.2rem;
      margin-bottom: 12px;
      font-family: var(--font-jp);
      font-weight: 400;
    }

    .card-desc {
      font-size: 0.95rem;
      color: var(--sub);
      margin-bottom: 20px;
      flex: 1;
      line-height: 1.6;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      color: var(--sub);
      border-top: 1px solid var(--border);
      padding-top: 12px;
    }

    .role {
      font-weight: 500;
    }

    .year {
      opacity: 0.7;
    }

    @media (max-width: 768px) {
      .projects-controls {
        grid-template-columns: 1fr;
        gap: 12px;
      }
      .project-grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body class="projects-page">

  <!-- 共通ヘッダー -->
  <header id="main-header" class="header-scrolled">
    <div class="logo">
      <a href="index.html">Kaworu Suzuki Portfolio</a>
    </div>
    <nav id="main-nav">
      <a href="index.html" id="nav-home">Home</a>
      <a href="projects.html" id="nav-project" class="current">Project</a>
      <a href="index.html#about-values" id="nav-about">About</a>
      <a href="index.html#contact" id="nav-contact">Contact</a>
      <span class="nav-indicator" aria-hidden="true"></span>
    </nav>
  </header>

  <!-- ブレッドクラムナビゲーション -->
  <div class="page-subnav">
    <span class="breadcrumb">
      <a href="index.html#projects">トップ</a>
      <span class="sep">›</span>
      <span class="current">Project</span>
    </span>
  </div>

  <!-- ヒーロー部分 -->
  <section class="projects-hero">
    <h1>All Projects</h1>
  </section>

  <div class="projects-controls">
    <div class="control-field">
      <label for="search">Search</label>
      <input id="search" type="search" placeholder="キーワードで検索">
    </div>
    <div class="control-field">
      <label for="filter">Category</label>
      <div class="select-shell" id="filter-shell">
        <button type="button" class="select-trigger" id="filter-trigger">All</button>
        <ul class="select-menu" id="filter-menu"></ul>
      </div>
    </div>
    <div class="control-field">
      <label for="sort">Sort</label>
      <div class="select-shell" id="sort-shell">
        <button type="button" class="select-trigger" id="sort-trigger">Newest</button>
        <ul class="select-menu" id="sort-menu">
          <li class="select-option is-active" data-value="newest">Newest</li>
          <li class="select-option" data-value="oldest">Oldest</li>
        </ul>
      </div>
    </div>
  </div>
  <div id="projects-count" class="projects-count"></div>

  <!-- プロジェクト一覧 -->
  <section class="projects-section">
    <div id="project-grid" class="project-grid"></div>
  </section>

  <script src="js/data.js?v=20260721-1"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/project-api.js?v=20260721-1"></script>
  <script src="js/main.js?v=20260628-2"></script>
  <script src="js/project-list.js?v=20260721-1"></script>
  
</body>
</html>
