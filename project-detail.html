<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detail | Thinking</title>
  <link rel="stylesheet" href="css/style.css?v=20260721-4">
  <style>
    
    :root { --header-h: 72px; }

    .hero-detail {
      width: 100vw;
      height: 100vh;
      margin-left: calc(50% - 50vw);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-top: var(--header-h);
      overflow: hidden;
    }

    .hero-detail::before {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(0,0,0,0.55) 0%,
        rgba(0,0,0,0.25) 45%,
        rgba(0,0,0,0.05) 70%,
        rgba(0,0,0,0.00) 100%
      );
      pointer-events: none;
    }

    .hero-detail-content {
      position: relative;
      z-index: 1;
      color: #fff;
      text-shadow: 0 6px 22px rgba(0,0,0,0.35);
      padding-left: 8vw;
    }

    .hero-detail-content h1 {
      font-family: 'Inter', 'Shippori Mincho', serif;
      font-size: clamp(1.8rem, 3vw, 3.2rem);
      line-height: 1.15;
      letter-spacing: 0.02em;
      font-weight: 200;
      max-width: 70%;
    }

    .hero-detail-content p {
      margin-top: 20px;
      font-size: 1rem;
      opacity: 0.9;
    }
  </style>
</head>

<body class="detail-page">

  <!-- 共通ヘッダー -->
  <header id="main-header" class="header-scrolled">
    <div class="logo">
      <a href="index.html">Kaworu Suzuki Portfolio</a>
    </div>
    <nav id="main-nav">
      <a href="index.html" id="nav-home">Home</a>
      <a href="index.html#projects" id="nav-project">Project</a>
      <a href="index.html#about-values" id="nav-about">About</a>
      <a href="index.html#contact" id="nav-contact">Contact</a>
      <span class="nav-indicator" aria-hidden="true"></span>
    </nav>
  </header>

  <div class="page-subnav">
    <span class="breadcrumb">
      <a id="breadcrumb-home" href="index.html#projects">トップ</a>
      <span class="sep">›</span>
      <span class="current" id="breadcrumb-title">Project</span>
    </span>
  </div>

  <!-- ヒーロー画像セクション -->


  <main id="detail-root"></main>

  <script src="js/data.js?v=20260721-1"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/project-api.js?v=20260721-1"></script>
  <script src="js/main.js?v=20260628-2"></script>
  <script src="js/project-view.js?v=20260721-1"></script>
</body>
</html>
