<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin | Projects</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .admin-wrap{
      max-width: 980px;
      margin: 0 auto;
      padding: calc(var(--header-h) + 40px) var(--container-pad) 80px;
      position: relative;
      z-index: 2;
    }
    .admin-card{
      border: 1px solid var(--border);
      border-radius: 16px;
      background: rgba(255,255,255,0.7);
      padding: 24px;
      margin-bottom: 24px;
      position: relative;
      z-index: 2;
    }
    .admin-title{
      font-family: var(--font-en);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--sub);
      margin-bottom: 16px;
    }
    .admin-grid{
      display: grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap: 16px;
    }
    .admin-field label{
      display:block;
      font-size:0.75rem;
      letter-spacing:0.12em;
      color:var(--sub);
      text-transform:uppercase;
      margin-bottom:6px;
      font-family: var(--font-en);
    }
    .admin-field input,
    .admin-field textarea{
      width:100%;
      padding:12px 14px;
      border-radius:12px;
      border:1px solid rgba(0,0,0,0.2);
      background: rgba(255,255,255,0.9);
      font-family: var(--font-jp);
      font-size:0.95rem;
      color:var(--text);
      outline:none;
    }
    .admin-field textarea{ min-height: 120px; }
    .admin-actions{
      display:flex;
      gap:12px;
      margin-top:16px;
    }
    .admin-btn{
      padding:10px 18px;
      border-radius:999px;
      border:1px solid var(--text);
      background:transparent;
      color:var(--text);
      font-family: var(--font-en);
      letter-spacing:0.08em;
      cursor:pointer;
      pointer-events: auto;
    }
    body::before,
    body::after{
      display: none !important;
    }
    .admin-list{
      display:grid;
      gap:12px;
    }
    .admin-item{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      padding:12px 14px;
      border:1px solid var(--border);
      border-radius:12px;
      background: rgba(255,255,255,0.7);
    }
    .admin-item small{
      color: var(--sub);
      font-family: var(--font-en);
      letter-spacing: 0.08em;
    }
    .tag-row{
      display:flex;
      flex-wrap:wrap;
      gap:8px;
      margin-top:8px;
    }
    .tag{
      padding:6px 10px;
      border-radius:999px;
      border:1px solid rgba(0,0,0,0.2);
      font-size:0.8rem;
      cursor:pointer;
      background: rgba(255,255,255,0.7);
    }
    .tag.is-active{
      background: rgba(0,0,0,0.08);
      border-color: rgba(0,0,0,0.3);
    }
    @media (max-width: 768px){
      .admin-grid{ grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <header id="main-header" class="header-scrolled">
    <div class="logo">
      <a href="index.html">Kaworu Suzuki Portfolio</a>
    </div>
  </header>

  <main class="admin-wrap">
    <section id="admin-login" class="admin-card">
      <p class="admin-title">Admin Login</p>
      <div class="admin-grid">
        <div class="admin-field">
          <label for="login-email">Email</label>
          <input id="login-email" type="email" autocomplete="email">
        </div>
        <div class="admin-field">
          <label for="login-password">Password</label>
          <input id="login-password" type="password" autocomplete="current-password">
        </div>
      </div>
      <div class="admin-actions">
        <button class="admin-btn" id="login-btn" type="button">Sign In</button>
      </div>
      <p id="login-status" style="margin-top:10px;color:var(--sub);"></p>
    </section>

    <section id="admin-panel" class="admin-card" style="display:none;">
      <p class="admin-title">Create / Edit Project</p>

      <div class="admin-grid">
        <div class="admin-field">
          <label for="p-date">日付 / やったこと</label>
          <input id="p-date" type="text" placeholder="2025 / Planning">
        </div>
        <div class="admin-field">
          <label for="p-title">タイトル</label>
          <input id="p-title" type="text">
        </div>
        <div class="admin-field">
          <label for="p-summary">簡単概要</label>
          <textarea id="p-summary"></textarea>
        </div>
        <div class="admin-field">
          <label for="p-overview">01. Overview</label>
          <textarea id="p-overview"></textarea>
        </div>
        <div class="admin-field">
          <label for="p-context">02. Context & Problem</label>
          <textarea id="p-context"></textarea>
        </div>
        <div class="admin-field">
          <label for="p-result">04. Result</label>
          <textarea id="p-result"></textarea>
        </div>
        <div class="admin-field">
          <label for="p-learning">05. Learning</label>
          <textarea id="p-learning"></textarea>
        </div>
        <div class="admin-field">
          <label>My Role</label>
          <input id="p-roles" type="text" placeholder="Role1, Role2">
          <div id="roles-tags" class="tag-row"></div>
        </div>
        <div class="admin-field">
          <label>Tools</label>
          <input id="p-tools" type="text" placeholder="Tool1, Tool2">
          <div id="tools-tags" class="tag-row"></div>
        </div>
        <div class="admin-field">
          <label for="p-links">Links（label:url を改行）</label>
          <textarea id="p-links" placeholder="Demo:https://..."></textarea>
        </div>
        <div class="admin-field">
          <label for="p-image">サムネ画像</label>
          <input id="p-image" type="file" accept="image/*">
        </div>
        <div class="admin-field">
          <label for="p-process1">03. Process Step 01</label>
          <textarea id="p-process1" placeholder="Research / 本文"></textarea>
        </div>
        <div class="admin-field">
          <label for="p-process2">03. Process Step 02</label>
          <textarea id="p-process2" placeholder="Concept / 本文"></textarea>
        </div>
        <div class="admin-field">
          <label for="p-process3">03. Process Step 03</label>
          <textarea id="p-process3" placeholder="Design / 本文"></textarea>
        </div>
      </div>

      <div class="admin-actions">
        <button class="admin-btn" id="save-btn" type="button">Save</button>
        <button class="admin-btn" id="logout-btn" type="button">Logout</button>
      </div>
      <p id="save-status" style="margin-top:10px;color:var(--sub);"></p>
    </section>

    <section class="admin-card">
      <p class="admin-title">Projects</p>
      <div id="admin-list" class="admin-list"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
